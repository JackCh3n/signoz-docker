global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 3s

# ClickHouse 原生协议：SigNoz / Collector / 迁移任务都通过这里访问集群
frontend clickhouse_tcp
    bind *:9000
    default_backend clickhouse_tcp_backend

backend clickhouse_tcp_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server ch0 signoz-clickhouse-0:9000 check inter 5s fall 3 rise 2
    server ch1 signoz-clickhouse-1:9000 check inter 5s fall 3 rise 2

# ClickHouse HTTP：便于巡检 / 排障；SigNoz 当前不依赖
frontend clickhouse_http
    mode http
    bind *:8123
    default_backend clickhouse_http_backend

backend clickhouse_http_backend
    mode http
    balance roundrobin
    option httpchk GET /ping
    http-check expect status 200
    server ch0 signoz-clickhouse-0:8123 check inter 5s fall 3 rise 2
    server ch1 signoz-clickhouse-1:8123 check inter 5s fall 3 rise 2
