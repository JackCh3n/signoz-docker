# =============================================================================
# SigNoz 离线包 · CNB (cnb.cool) 云原生构建流水线
#
# 与 .github/workflows/release.yml 的行为对齐：
#   - push main/master : 构建 amd64 + arm64 离线包，滚动发布 Release `latest`
#   - push tag v*      : 构建后发布到同名 Release（固化）
#   - web_trigger      : 页面手动触发，发布 `latest`
#   - pull_request     : 只做脚本语法与离线资产轻量校验
#
# 构建要点
#   1. 必须声明 `services: [docker]`，由 CNB 注入 dind 与 docker CLI，
#      否则 bundle.sh 会在 `docker info` 处失败。
#   2. 两个架构在同一个流水线里串行构建：bundle.sh 只做 docker pull/save，
#      异架构镜像不需要 QEMU；构建完 amd64 后清理一次 dind 镜像，给 arm64 腾磁盘。
#   3. 只创建一次 Release（git:release），再由 attachments 上传两个架构的
#      离线包，避免两条并行流水线同时写同一个 Release 产生竞争。
# =============================================================================

# ── 发布环境（amd64 节点；arm64 镜像只拉取不运行，无需 ARM runner） ─────────
.release-env: &release-env
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  services:
    - docker
  docker:
    image: debian:bookworm-slim

# 只在影响离线包内容的文件变动时触发，避免 README 改动也跑一次 GB 级构建
.if-modify: &if-modify
  - "bundle.sh"
  - "install.sh"
  - "docker-compose.yaml"
  - ".env.example"
  - "config/**"
  - "assets/**"
  - ".cnb.yml"

# ── 发布流水线（主线 / 版本 tag / 手动触发共用） ───────────────────────────
.stages: &stages
  # 判定本次是主线还是版本 tag（tag_push 时 CNB_BRANCH 为 tag 名）
  - name: resolve-scene
    script: |
      set -e
      REF="${CNB_BRANCH:-}"
      case "$REF" in
        v*)
          TAG="$REF"
          TITLE="SigNoz 离线部署包 ${TAG}"
          echo ">>> 场景: 版本发布（tag=${TAG}）"
          ;;
        *)
          TAG="latest"
          TITLE="SigNoz 离线部署包（latest）"
          echo ">>> 场景: 主线发布（ref=${REF}）"
          ;;
      esac
      echo "##[set-output TAG=${TAG}]"
      echo "##[set-output TITLE=${TITLE}]"
    exports:
      TAG: RELEASE_TAG
      TITLE: RELEASE_TITLE

  # 失败前置拦截：脚本语法、必要文件、dind 可用性
  - name: validate
    script: |
      set -e
      bash -n bundle.sh install.sh
      for f in docker-compose.yaml install.sh .env.example README.md \
               config/ingester/ingester.yaml config/ingester/opamp.yaml \
               config/telemetrykeeper/clickhousekeeper/keeper-0.yaml \
               config/telemetrystore/clickhouse/config-0-0.yaml \
               config/telemetrystore/clickhouse/functions.yaml \
               assets/histogram-quantile/histogram-quantile-linux-amd64 \
               assets/histogram-quantile/histogram-quantile-linux-arm64; do
        [ -f "$f" ] || { echo "缺少必要文件: $f"; exit 1; }
      done
      docker version --format 'Docker {{.Server.Version}}'
      echo ">>> 预检通过"

  - name: build-amd64
    script: |
      set -e
      bash ./bundle.sh --arch amd64
      # 清掉 amd64 镜像层，给 arm64 留出磁盘（dind 数据卷通常只有几十 GB）
      docker image prune -af >/dev/null 2>&1 || true

  - name: build-arm64
    script: |
      set -e
      bash ./bundle.sh --arch arm64

  - name: verify
    script: |
      set -e
      ls -lh dist
      cd dist
      sha256sum -c ./*.sha256
      for f in ./*.tar.gz; do
        size="$(stat -c%s "$f")"
        echo ">>> ${f}: ${size} bytes"
        [ "$size" -lt 2147483648 ] || { echo "超过 Release 2 GiB 单文件上限"; exit 1; }
      done

  - name: gen-notes
    script: |
      set -e
      set -a
      . ./.env.example
      set +a
      {
        echo "## ${RELEASE_TITLE}"
        echo
        echo "SigNoz 单机 Docker Compose **离线部署包**，组件版本已固定，适用于内网 / 离线环境。"
        echo
        echo "构建提交：\`${CNB_COMMIT_SHORT:-${CNB_COMMIT:-}}\`　构建时间：$(date '+%Y-%m-%d %H:%M %Z')"
        echo
        echo "### 组件版本"
        echo
        echo "| 组件 | 版本 |"
        echo "|------|------|"
        echo "| SigNoz | \`${SIGNOZ_VERSION}\` |"
        echo "| OTel Collector | \`${COLLECTOR_VERSION}\` |"
        echo "| ClickHouse Server / Keeper | \`${CLICKHOUSE_VERSION}\` |"
        echo "| PostgreSQL | \`${POSTGRES_VERSION}\` |"
        echo
        echo "### 产物"
        echo
        echo "| 架构 | 文件 | 大小 |"
        echo "|------|------|------|"
        for f in dist/*.tar.gz; do
          name="$(basename "$f")"
          arch="$(printf '%s' "$name" | sed -nE 's/.*-(amd64|arm64)\.tar\.gz/\1/p')"
          printf '| %s | %s | %s |\n' "${arch:-unknown}" "\`${name}\`" "$(du -h "$f" | cut -f1)"
        done
        echo
        echo "### 内网安装"
        echo
        echo '```bash'
        echo "sha256sum -c signoz-offline-${SIGNOZ_VERSION}-<架构>.tar.gz.sha256"
        echo "tar xzf signoz-offline-${SIGNOZ_VERSION}-<架构>.tar.gz"
        echo "cd signoz-offline-${SIGNOZ_VERSION}-<架构>"
        echo "./install.sh --check   # 预检"
        echo "./install.sh           # 导入镜像并启动"
        echo '```'
        echo
        echo "包内含 5 个镜像的 \`docker save\` 包、Compose 清单、全部配置、双架构 histogram-quantile 与安装脚本；安装过程不访问外网。"
        echo
        echo "> 首次启动需初始化 ClickHouse，建议至少 4 GB 内存（推荐 8 GB）与 10 GB 磁盘。"
      } > RELEASE_NOTES.md
      cat RELEASE_NOTES.md

  - name: create-release
    type: git:release
    options:
      tag: $RELEASE_TAG
      title: $RELEASE_TITLE
      descriptionFromFile: RELEASE_NOTES.md
      latest: true

  - name: upload-attachments
    image: cnbcool/attachments:latest
    settings:
      tag: $RELEASE_TAG
      attachments:
        - "./dist/*"

# ── 主线：main / master push → 滚动发布 latest ─────────────────────────────
main:
  push:
    - name: release-mainline
      <<: *release-env
      ifModify: *if-modify
      stages: *stages

master:
  push:
    - name: release-mainline
      <<: *release-env
      ifModify: *if-modify
      stages: *stages

# ── 版本 tag：v* → 同名 Release ────────────────────────────────────────────
# 注意：不要改成兜底 `$`，否则 mainline 创建的 `latest` tag 会再次触发构建。
"v*":
  tag_push:
    - name: release-tag
      <<: *release-env
      stages: *stages

# ── 手动触发与 PR 校验 ─────────────────────────────────────────────────────
"**":
  web_trigger:
    - name: release-manual
      <<: *release-env
      stages: *stages

  pull_request:
    - name: validate
      docker:
        image: debian:bookworm-slim
      stages:
        - name: shell-and-assets
          script: |
            set -e
            bash -n bundle.sh install.sh
            for f in docker-compose.yaml install.sh .env.example \
                     config/ingester/ingester.yaml config/ingester/opamp.yaml \
                     config/telemetrykeeper/clickhousekeeper/keeper-0.yaml \
                     config/telemetrystore/clickhouse/config-0-0.yaml \
                     config/telemetrystore/clickhouse/functions.yaml \
                     assets/histogram-quantile/histogram-quantile-linux-amd64 \
                     assets/histogram-quantile/histogram-quantile-linux-arm64; do
              [ -f "$f" ] || { echo "缺少必要文件: $f"; exit 1; }
            done
            echo ">>> 校验通过"
